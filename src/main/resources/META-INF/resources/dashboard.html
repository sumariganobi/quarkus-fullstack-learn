<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quarkus App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#667eea',
                        secondary: '#764ba2',
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth transitions for sidebar */
        .sidebar-transition {
            transition: transform 0.3s ease-in-out;
        }
        
        /* Overlay for mobile */
        .sidebar-overlay {
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Sidebar Container -->
    <div id="sidebarContainer"></div>

    <!-- Main Content -->
    <div id="mainContent" class="lg:ml-64 transition-all duration-300">
        <!-- Top Bar -->
        <header class="bg-white border-b border-gray-200 sticky top-0 z-20">
            <div class="flex items-center justify-between px-4 lg:px-8 py-4">
                <div class="flex items-center gap-4">
                    <!-- Hamburger Menu -->
                    <button onclick="toggleSidebar()" class="lg:hidden text-gray-600 hover:text-gray-900">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <div>
                        <h1 class="text-xl lg:text-2xl font-bold text-gray-900">Dashboard</h1>
                        <p class="text-sm text-gray-600 hidden sm:block">Welcome back, <span id="welcomeName">User</span>!</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 lg:gap-4">
                    <button class="relative p-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">
                        <i class="fas fa-bell text-lg lg:text-xl"></i>
                        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                    </button>
                    <!-- <button class="p-2 text-gray-600 hover:bg-gray-100 rounded-lg transition hidden sm:block">
                        <i class="fas fa-search text-lg lg:text-xl"></i>
                    </button> -->
                </div>
            </div>
        </header>

        <!-- Dashboard Content -->
        <main class="p-4 lg:p-4">
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 lg:gap-6 mb-4 lg:mb-4">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 lg:p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-10 h-10 lg:w-12 lg:h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-box text-blue-600 text-lg lg:text-xl"></i>
                        </div>
                        <span class="text-xs font-medium text-green-600 bg-green-100 px-2 py-1 rounded-full">
                            +12%
                        </span>
                    </div>
                    <h3 class="text-xl lg:text-2xl font-bold text-gray-900" id="totalProducts">0</h3>
                    <p class="text-sm text-gray-600">Total Products</p>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 lg:p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-10 h-10 lg:w-12 lg:h-12 bg-green-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-warehouse text-green-600 text-lg lg:text-xl"></i>
                        </div>
                        <span class="text-xs font-medium text-green-600 bg-green-100 px-2 py-1 rounded-full">
                            +8%
                        </span>
                    </div>
                    <h3 class="text-xl lg:text-2xl font-bold text-gray-900" id="totalWarehouses">0</h3>
                    <p class="text-sm text-gray-600">Total Warehouses</p>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 lg:p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-10 h-10 lg:w-12 lg:h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-cubes text-purple-600 text-lg lg:text-xl"></i>
                        </div>
                        <span class="text-xs font-medium text-red-600 bg-red-100 px-2 py-1 rounded-full">
                            -3%
                        </span>
                    </div>
                    <h3 class="text-xl lg:text-2xl font-bold text-gray-900" id="totalStock">0</h3>
                    <p class="text-sm text-gray-600">Total Stock</p>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 lg:p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="w-10 h-10 lg:w-12 lg:h-12 bg-orange-100 rounded-lg flex items-center justify-center">
                            <i class="fas fa-chart-line text-orange-600 text-lg lg:text-xl"></i>
                        </div>
                        <span class="text-xs font-medium text-green-600 bg-green-100 px-2 py-1 rounded-full">
                            +15%
                        </span>
                    </div>
                    <h3 class="text-xl lg:text-2xl font-bold text-gray-900" id="totalCapacity">0</h3>
                    <p class="text-sm text-gray-600">Total Capacity</p>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-3 lg:p-4">
                <h3 class="text-lg font-semibold text-gray-900 mb-1">Recent Products</h3>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-gray-200">
                                <th class="text-left py-3 px-2 lg:px-4 text-xs lg:text-sm font-medium text-gray-600">Product</th>
                                <th class="text-left py-3 px-2 lg:px-4 text-xs lg:text-sm font-medium text-gray-600">Price</th>
                                <th class="text-left py-3 px-2 lg:px-4 text-xs lg:text-sm font-medium text-gray-600 hidden sm:table-cell">Stock</th>
                                <th class="text-left py-3 px-2 lg:px-4 text-xs lg:text-sm font-medium text-gray-600 hidden md:table-cell">Status</th>
                            </tr>
                        </thead>
                        <tbody id="recentProducts">
                            <tr>
                                <td colspan="4" class="text-center py-8 text-gray-500">
                                    <i class="fas fa-spinner fa-spin text-2xl"></i>
                                    <p class="mt-2">Loading...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Toggle sidebar function
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        // Close sidebar when clicking outside on mobile
        window.addEventListener('resize', function() {
            if (window.innerWidth >= 1024) {
                document.getElementById('sidebar').classList.remove('-translate-x-full');
                document.getElementById('sidebarOverlay').classList.add('hidden');
            }
        });
    </script>
    <script src="sidebar.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
