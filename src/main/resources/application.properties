# Database Configuration (MySQL 8.0)
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/quarkus_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}

# Hibernate Configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=no-file

# Flyway Configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# HTTP Configuration
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# Logging
quarkus.log.console.enable=true
quarkus.log.console.level=INFO
quarkus.log.category."com.example".level=DEBUG

# CORS Configuration
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# External Auth API Configuration
quarkus.rest-client.external-auth-api.url=${API_HCBE}
quarkus.rest-client.external-auth-api.scope=jakarta.inject.Singleton
quarkus.rest-client.external-auth-api.trust-all=true

quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.auth.basic=true

quarkus.http.auth.session.encrypted=true
quarkus.http.auth.session.cookie.same-site=None
quarkus.http.auth.session.cookie.secure=false